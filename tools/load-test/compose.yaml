services:
  load-test:
    network_mode: "host"
    environment:
      BASE_URL: "https://10.51.3.9/ctf"
      STAGE_ONE_DURATION: "1m"
      STAGE_TWO_DURATION: "3m"
      STAGE_THREE_DURATION: "1m"
      STAGE_ONE_VUS: 30
      STAGE_TWO_VUS: 75
      STAGE_THREE_VUS: 30
      K6_WEB_DASHBOARD: "true"
      K6_LOG_OUTPUT: "file=output/logging.txt,level=trace"

    cap_add:
      - SYS_ADMIN
    build:
      context: .
    volumes:
      - ./output:/app/output:rw
