worker_processes 4;

events {
  worker_connections 1024;
}

http {
  proxy_cache_path /var/cache/nginx/auth_cache levels=1:2 keys_zone=port_forward_auth_cache:1m max_size=100m inactive=1m;

  # Configuration containing list of application servers
  upstream app_servers {
    server ctfd:8000;
  }

  upstream vite_servers {
    server vite:5173;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;

    ssl_certificate /certificates/sslpublickey.pem;
    ssl_certificate_key /certificates/privatesslkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    client_max_body_size 4G;
    include /etc/nginx/mime.types;

    # Redirect to /ctfd by default
    # location = / {
    #   return 301 /ctfd;
    # }

    location /socket.io/ {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
      
      # Prevent timeouts on long WebSocket connections
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
      proxy_cache off;
    }

    # Handle Server Sent Events for Notifications
    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
    }

    # Proxy connections to the application servers
    location / {
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
    }

    location /static {
      proxy_pass http://vite_servers;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
    }

    location /dist {
      alias /var/www/vite-build/;
      autoindex off;
      try_files $uri $uri/ =404;
    }

    location /websockify {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_http_version 1.1;
      proxy_pass https://127.0.0.1/ng/vnc/access/websockify;
    }

    location ~^/ng/vnc/access/(.*)$ {
      auth_request /ng/vnc/authenticate;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_http_version 1.1;
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $host_port $upstream_http_host_port;

       # Trust self signed cert used in vnc image
      proxy_ssl_trusted_certificate /etc/nginx/self.pem;

      # connect directly to the host & ephemeral port
      proxy_pass https://$host_ip:$host_port/$1;
    }

    location /ng/vnc/authenticate {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_cache port_forward_auth_cache;
      proxy_cache_key "$remote_addr";
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass http://app_servers/ng/container/vnc;
    }
    location ~^/ng/admin/container/(?<container_id>\d+)/exec$ {
      auth_request "/ng/admin/container/exec-auth";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      # set the response headers with the container host IP & port
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $docker_id $upstream_http_docker_id;
      # auth_request_set $host_port $upstream_http_host_port;

      # connect directly to the host & ephemeral port
      proxy_set_header docker-id $docker_id;

      proxy_pass http://$host_ip:8099/;
    }

    location /ng/admin/container/exec-auth {
        #internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;

      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header container-id $container_id;

      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass "http://app_servers/ng/admin/container/$1/exec-forward";
    }

  }

  server {
    listen 5173;
    gzip on;
    client_max_body_size 4G;

    location / {
      proxy_pass http://vite_servers;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Port 5173;
      proxy_http_version 1.1;
    }
  }
}
