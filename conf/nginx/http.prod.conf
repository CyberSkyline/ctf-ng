worker_processes 4;

events {
  worker_connections 1024;
}

http {
  proxy_cache_path /var/cache/nginx/auth_cache levels=1:2 keys_zone=port_forward_auth_cache:1m max_size=100m inactive=1m;
  proxy_cache_path /var/cache/nginx/grafana_auth_cache levels=1:2 keys_zone=grafana_auth_cache:1m max_size=100m inactive=1m;

	resolver 127.0.0.11 valid=30s;

  # Configuration containing list of application servers
  upstream app_servers {
    zone app_servers 64k;
    hash $cookie_session consistent;
    server ctfng_app-1:8000 resolve;
    server ctfng_app-2:8000 resolve;
    server ctfng_app-3:8000 resolve;
    server ctfng_app-4:8000 resolve;
    server ctfng_app-5:8000 resolve;
    server ctfng_app-6:8000 resolve;
    server ctfng_app-7:8000 resolve;
    server ctfng_app-8:8000 resolve;
  }

  upstream grafana_servers {
    server grafana:3000;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;

    # Restrict access to specific cloudflare IP ranges
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 108.162.192.0/18;
    allow 131.0.72.0/22;
    allow 141.101.64.0/18;
    allow 162.158.0.0/15;
    allow 172.64.0.0/13;
    allow 173.245.48.0/20;
    allow 188.114.96.0/20;
    allow 190.93.240.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;

    deny all;

    ssl_certificate /certificates/sslpublickey.pem;
    ssl_certificate_key /certificates/privatesslkey.pem;
    ssl_protocols TLSv1.3;

    gzip on;
    client_max_body_size 4G;
    include /etc/nginx/mime.types;

    # Redirect to /ctfd by default
    # location = / {
    #   return 301 /ctfd;
    # }

    # Deny access to .git and .github folders
    location ~ /\.git {
        deny all;
        return 404;
    }

    location /socket.io/ {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
      
      # Prevent timeouts on long WebSocket connections
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
      proxy_cache off;
    }

    # Proxy connections to the application servers
    location /ctf/ {
      rewrite ^/ctf(/.*)$ $1 break; # Remove /ctf prefix
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Port 443;
    }

    location /ctf/admin/grafana/ {
      auth_request /ctf/ng/admin/reports-auth;

      rewrite ^/ctf/admin/grafana(/.*)$ $1 break;

      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;

      proxy_pass http://grafana_servers;
    }

    location /ctf/admin/grafana/api/live/ {
      auth_request /ctf/ng/admin/reports-auth;

      rewrite ^/ctf/admin/grafana(/.*)$ $1 break;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;

      proxy_pass http://grafana_servers;
    }

    location /ctf/ng/admin/reports-auth {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;

      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;

      proxy_cache grafana_auth_cache;
      proxy_cache_key "$cookie_session|$remote_addr";
      proxy_cache_valid 200 302 1m;
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass http://app_servers/ng/admin/reports-auth;
    }

    location /dist/ {
      alias /var/www/vite-build/;
      autoindex off;
      try_files $uri $uri/ =404;
    }

    location /websockify {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_http_version 1.1;
      proxy_pass https://127.0.0.1/ctf/ng/vnc/access/websockify;
    }

    location ~^/ctf/ng/vnc/access/(.*)$ {
      auth_request /ctf/ng/vnc/authenticate;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_http_version 1.1;
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $host_port $upstream_http_host_port;

       # Trust self signed cert used in vnc image
      proxy_ssl_trusted_certificate /etc/nginx/self.pem;

      # connect directly to the host & ephemeral port
      proxy_pass https://$host_ip:$host_port/$1;
    }

    location /ctf/ng/vnc/authenticate {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass http://app_servers/ng/container/vnc;
    }
    location ~^/ctf/ng/admin/user/(?<user_id>\d+)/vnc/access/(.*)$ {
      auth_request /ctf/ng/admin/vnc/authenticate;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      # set the response headers with the container host IP & port
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $host_port $upstream_http_host_port;

      # connect directly to the host & ephemeral port
      #return 200 "var 1: $1 host ip: $host_ip host_port: $host_port";
      proxy_pass http://$host_ip:$host_port/$2;
    }

    location /ctf/ng/admin/vnc/authenticate {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;

      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      #proxy_cache port_forward_auth_cache;
      #proxy_cache_key "$remote_addr";
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass http://app_servers/ng/admin/container/vnc/$user_id/view;
    }

    location ~^/ng/admin/container/(?<container_id>\d+)/exec$ {
      auth_request "/ng/admin/container/exec-auth";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      # set the response headers with the container host IP & port
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $docker_id $upstream_http_docker_id;
      auth_request_set $psk $upstream_http_psk;
      # auth_request_set $host_port $upstream_http_host_port;

      # connect directly to the host & ephemeral port
      proxy_set_header docker-id $docker_id;
      proxy_set_header psk $psk;

      proxy_pass http://$host_ip:8099/;
    }

    location /ng/admin/container/exec-auth {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;

      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header container-id $container_id;

      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass "http://app_servers/ng/admin/container/exec-forward";
    }

    # TODO app servers need better shielding on the routes like with specified 404s

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # PROXY for OAuth endpoints
    location /id/Account/ {
        proxy_pass https://pccc.cisa.gov;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host pccc.cisa.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 504 403 = @redirect_id;
    }

    location /id/connect/ {
        proxy_pass https://pccc.cisa.gov;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host pccc.cisa.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 504 403 = @redirect_id;
    }

    # REDIRECT for all other /id paths
    location /id {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    location /id/ {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    # PROXY for gameboard endpoints
    location /gb/auth/ {
        proxy_pass https://pccc.cisa.gov;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host pccc.cisa.gov;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 504 403 = @redirect_gb;
    }

    # REDIRECT for all other /gb paths
    location /gb {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    location /gb/ {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    location @redirect_id {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    location @redirect_gb {
        return 301 https://pccc.cisa.gov$request_uri;
    }

    location /ctf/ng/admin/container/execforward {
      return 404;
    }
  
    location /ctf/ng/container/vnc {
      return 404;
    }

    location ~^/ctf/ng/admin/container/vnc/(?<user_id>\d+)/view$ {
      return 404;
    }
  }
}

