worker_processes 4;

events {
  worker_connections 1024;
}

http {
  proxy_cache_path /var/cache/nginx/auth_cache levels=1:2 keys_zone=port_forward_auth_cache:1m max_size=100m inactive=1m;

  # Configuration containing list of application servers
  upstream app_servers {
    server ctfd:8000;
  }

  upstream vite_servers {
    server vite:5173;
  }

  server {
    listen 80;

    gzip on;
    client_max_body_size 4G;
    include /etc/nginx/mime.types;

    # Redirect to /ctfd by default
    # location = / {
    #   return 301 /ctfd;
    # }

    # Socket.IO WebSocket support for notifications
    location /socket.io/ {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      
      # Prevent timeouts on long WebSocket connections
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
      proxy_cache off;
    }

    # Handle Server Sent Events for Notifications
    location /events {

      # rewrite ^/ctfd(/.*)$ $1 break; # Remove /ctfd prefix
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    # Proxy connections to the application servers
    location / {

      # rewrite ^/ctfd(/.*)$ $1 break; # Remove /ctfd prefix
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /static {
      # rewrite ^/static(/.*)$ $1 break; # Remove /static prefix
      proxy_pass http://vite_servers;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
    }

    location /dist {
      alias /var/www/vite-build/;
      autoindex off;
      try_files $uri $uri/ =404;
    }

    location /websockify {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_pass http://127.0.0.1/ng/vnc/access/websockify;
    }

    location ~^/ng/vnc/access/(.*)$ {
      auth_request /ng/vnc/authenticate;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      # set the response headers with the container host IP & port
      auth_request_set $host_ip $upstream_http_host_ip;
      auth_request_set $host_port $upstream_http_host_port;

      # connect directly to the host & ephemeral port
      proxy_pass http://$host_ip:$host_port/$1;
    }

    location /ng/vnc/authenticate {
      internal;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;

      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_cache port_forward_auth_cache;
      proxy_cache_key "$remote_addr";
      proxy_pass_request_body off;
      proxy_redirect off;

      proxy_pass http://app_servers/ng/container/vnc;
    }
  }

  server {
    listen 5173;
    gzip on;
    client_max_body_size 4G;

    location / {
      proxy_pass http://vite_servers;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
    }
  }
}