apiVersion: 1

providers:
  - name: "provisioned-dashboards"
    folder: ""
    folderUid: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # admins can edit dashboards via UI, but changes won't be saved back to the json file.
    # to persist an updated dashboard, export the dashboard and replace the json.
    # any changes to a provisioned dashboard file will overwrite local changes.
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
