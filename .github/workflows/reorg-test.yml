name: After refactor test of test runner

on:
  push:
    branches:
      - 'feature/middleware-plus-reorg'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12.8' ] 

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r external/CTFd/requirements.txt
          pip install -r backend/ctfd/plugin/requirements.txt
          pip install pytest

      - name: Run Main Test Suite (middleware next)
        id: main_tests
        working-directory: backend/ctfd/plugin
        run: make test-all

      - name: Run Middleware Test Suite (even if main fails)
        if: always()
        working-directory: backend/ctfd/plugin
        run: make test-middleware
