name: semver
on:
  pull_request:
    types: [ closed ]
    branches:
      - development

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine bump from labels
        id: bump_level
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const has = name => labels.includes(name);
            let level = 'patch';
            if (has('semver:major')) level = 'major';
            else if (has('semver:minor')) level = 'minor';
            else if (has('semver:patch')) level = 'patch';
            core.info(`Labels: ${labels.join(', ') || 'none'}`);
            core.info(`Selected bump level: ${level}`);
            core.setOutput('level', level);

      - name: Get latest version (defaults to v0.0.0)
        id: latest_tag
        run: |
          set -euo pipefail
          latest=$(git tag --list "v*" --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            # Fall back to the last version under the old dev- prefix so numbering carries over
            legacy=$(git tag --list "dev-v*" --sort=-v:refname | head -n1)
            latest="${legacy#dev-}"
          fi
          echo "tag=${latest:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: bump
        uses: actions-ecosystem/action-bump-semver@v1
        with:
          current_version: ${{ steps.latest_tag.outputs.tag }}
          level: ${{ steps.bump_level.outputs.level }}

      - name: Create tag
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          new_tag="${{ steps.bump.outputs.new_version }}"
          if git rev-parse "${new_tag}" >/dev/null 2>&1; then
            echo "Tag ${new_tag} already exists. Skipping."
            exit 0
          fi
          git tag -a "${new_tag}" -m "Release ${new_tag} from PR #${{ github.event.pull_request.number }}"
          git push origin "${new_tag}"

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
