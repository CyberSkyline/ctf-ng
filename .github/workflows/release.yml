name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Which branch to release (always matches the ECR repo it pushes to)"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ctfd-ng
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ENVIRONMENT: ${{ inputs.ref }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          IMAGE="$REGISTRY/ctf-ng/app/$ENVIRONMENT:$SHA"
          docker build -t "$IMAGE" -f ./dockerfiles/ctfd.Dockerfile .
          docker push "$IMAGE"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload frontend
        run: .bin/build_and_upload_frontend.sh
