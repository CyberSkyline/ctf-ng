name: Deploy to Staging with Failover

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

    - name: Add known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.DEV_SSH_HOST_1 }} >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.DEV_SSH_HOST_2 }} >> ~/.ssh/known_hosts

    - name: Attempt deployment to Primary Instance
      id: deploy-primary
      continue-on-error: true
      run: |
        echo "Deploying to primary instance (${{ secrets.DEV_SSH_HOST_1 }})..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_1 }} '
          cd /mnt/app-dev && \
          echo "Pulling latest code && \
          git pull origin main && \
          echo "Stopping containers && \
          docker-compose down && \
          echo "Pulling latest images && \
          docker-compose pull && \
          echo "Starting containers && \
          docker-compose up -d --build && \
          echo "Cleaning up..." && \
          docker image prune -f && \
          echo "Primary deployment completed successfully"
        '
        echo "primary_success=true" >> $GITHUB_OUTPUT
        echo "Primary instance deployment successful"

    - name: Attempt deployment to Secondary Instance
      id: deploy-secondary
      if: steps.deploy-primary.outcome == 'failure'
      run: |
        echo "Primary failed, trying secondary instance (${{ secrets.DEV_SSH_HOST_2 }})..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_2 }} '
          cd /mnt/app-dev && \
          echo "Pulling latest code" && \
          git pull origin main && \
          echo "Stopping containers" && \
          docker-compose down && \
          echo "Pulling latest images" && \
          docker-compose pull && \
          echo "Starting containers" && \
          docker-compose up -d --build && \
          echo "Cleaning up" && \
          docker image prune -f && \
          echo "Secondary deployment completed successfully"
        '
        echo "secondary_deployed=true" >> $GITHUB_OUTPUT
        echo "Secondary instance deployment successful"

    - name: Verify primary instance
      if: steps.deploy-primary.outcome == 'success'
      run: |
        echo "Checking primary instance containers..."
        ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_1 }} '
          echo "Container status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

    - name: Verify secondary instance
      if: steps.deploy-secondary.outcome == 'success'
      run: |
        echo "Checking secondary instance containers..."
        ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_2 }} '
          echo "Container status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

    - name: Check both instances (fallback verification)
      if: always()
      run: |
        echo "Overall deployment status check
        
        # Check primary if it was attempted
        if [ "${{ steps.deploy-primary.outcome }}" = "success" ]; then
          echo "Checking primary instance connectivity
          if ssh -o ConnectTimeout=5 ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_1 }} 'exit 0'; then
            echo "Primary instance is reachable"
          else
            echo "Primary instance is unreachable"
          fi
        fi
        
        # Check secondary if it was attempted
        if [ "${{ steps.deploy-secondary.outcome }}" = "success" ] || [ "${{ steps.deploy-primary.outcome }}" = "failure" ]; then
          echo "Checking secondary instance connectivity..."
          if ssh -o ConnectTimeout=5 ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST_2 }} 'exit 0'; then
            echo "Secondary instance is reachable"
          else
            echo "Secondary instance is unreachable"
          fi
        fi