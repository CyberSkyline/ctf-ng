name: chall-check test runner

on:
  pull_request:
    paths:
      - 'tools/chall-check/**'
      - 'lib/parser/**'
      - '.github/workflows/chall-check-testrunner.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: |
          cd lib/parser
          pip install -e .

      - name: Install chall-check dependencies
        run: |
          cd tools/chall-check
          pip install -e . pytest

      - name: Run chall-check tests
        working-directory: tools/chall-check
        run: python -m pytest

      - name: Run parser tests
        working-directory: lib/parser
        run: python -m pytest