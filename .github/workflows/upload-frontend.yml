name: Upload frontend build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or commit)"
        required: true
        default: production

permissions:
  id-token: write
  contents: read

jobs:
  upload-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd frontend && pnpm vite build

      - name: Resolve commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          RELEASE: ${{ steps.resolve.outputs.sha }}
        run: |
          aws s3 sync frontend/dist/$RELEASE s3://ctfng-builds/$RELEASE/ \
            --exclude "*.map" \
            --content-disposition "inline" \
            --storage-class ONEZONE_IA \
            --delete
