name: frontend-linter
on: [ pull_request ]
jobs:
 linter-test:
    name: Linter Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name : Enable Corepack
      run: corepack enable

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install
      run: |
        cd frontend
        pnpm install

    - name: Test
      run: |
        cd frontend
        pnpm run lint
      env:
        CI: true
