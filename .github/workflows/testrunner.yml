name: Test Runner

on: [ pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize and update submodules
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r backend/ng/requirements.txt -r external/CTFd/requirements.txt

      # - name: Run Main Test Suite
      #   working-directory: backend/ng
      #   run: make test-all
        
      - name: Run Leaderboard Test Suite (even if main fails)
        if: always()
        working-directory: backend/ng
        run: make test-leaderboard

      # - name: Run Middleware Test Suite (even if main fails)
      #   if: always()
      #   working-directory: backend/ng
      #   run: make test-middleware
