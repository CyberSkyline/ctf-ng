name: backend-linter
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-linter.yml'
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.0"
          src: "./backend"
          args: "check --config ./backend/pyproject.toml"
