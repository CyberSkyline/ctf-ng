name: Deploy to Staging from Workspace

on:
  workflow_dispatch:
  push:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy-key
        chmod 600 ~/.ssh/deploy-key
        ssh-keyscan -H ${{ secrets.STAGING_HOST_1 }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to ctfng-staging-1
      run: |
        ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_1 }} '
          cd /mnt/app-dev && \
          docker compose down && \
          cd ./frontend && vite build && \
          ENV_FILE=.env.staging docker compose -f docker-compose.prod.yaml up -d --build ctfd vite
        '

    - name: Cleanup
      run: |
        rm -f ~/.ssh/deploy-key
        rm -f ~/.ssh/known_hosts