name: Deploy to Staging from Workspace

on:
  workflow_dispatch:
  push:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy-key
        chmod 600 ~/.ssh/deploy-key
        ssh-keyscan -H ${{ secrets.STAGING_HOST_1 }} >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.STAGING_HOST_2 }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to ctfng-staging-1
      run: |
        ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_1 }} '
          cd /mnt/app-dev && \
          git pull origin staging && \
          COMPOSE_PROJECT_NAME=staging ENV_FILE=.env.staging docker compose -f docker-compose.prod.yaml down && \
          COMPOSE_PROJECT_NAME=staging ENV_FILE=.env.staging docker compose -f docker-compose.prod.yaml up -d --build
        '

    - name: Verify EFS synchronization
      run: |
        COMMIT_1=$(ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_1 }} 'cd /mnt/app-dev && git rev-parse --short HEAD')
        COMMIT_2=$(ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_2 }} 'cd /mnt/app-dev && git rev-parse --short HEAD')
        if [ "$COMMIT_1" != "$COMMIT_2" ]; then
          echo "EFS sync failed: $COMMIT_1 vs $COMMIT_2"
          exit 1
        fi
        echo "EFS synchronized: $COMMIT_1"

    - name: Deploy to ctfng-staging-2
      run: |
        ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_2 }} '
          cd /mnt/app-dev && \
          COMPOSE_PROJECT_NAME=staging ENV_FILE=.env.staging docker compose -f docker-compose.prod.yaml down && \
          COMPOSE_PROJECT_NAME=staging ENV_FILE=.env.staging docker compose -f docker-compose.prod.yaml up -d --build
        '

    - name: Verify deployments
      run: |
        echo "ctfng-staging-1 containers:"
        ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_1 }} 'docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
        echo "ctfng-staging-2 containers:"
        ssh -i ~/.ssh/deploy-key ubuntu@${{ secrets.STAGING_HOST_2 }} 'docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'

    - name: Cleanup
      run: |
        rm -f ~/.ssh/deploy-key
        rm -f ~/.ssh/known_hosts