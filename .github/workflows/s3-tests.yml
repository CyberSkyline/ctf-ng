name: S3 Integration Tests

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    paths:
      - 'backend/ng/fileuploads/**'
      - 'backend/ng/support/services/s3_upload_service.py'
      - 'backend/ng/core/services/s3_service.py'
      - 'backend/ng/**/*s3*'
  pull_request:
    paths:
      - 'backend/ng/fileuploads/**'
      - 'backend/ng/support/services/s3_upload_service.py' 
      - 'backend/ng/core/services/s3_service.py'
      - 'backend/ng/**/*s3*'

jobs:
  s3-tests:
    runs-on: ubuntu-latest
    # Only run if S3 credentials are available
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'CyberSkyline/ctf-ng' && github.actor != 'dependabot[bot]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize and update submodules
        run: git submodule update --init --recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-s3-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-s3-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r backend/ng/requirements.txt -r external/CTFd/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Run S3 Standalone Tests
        working-directory: backend/ng
        run: |
          echo "Running standalone S3 tests..."
          make test-s3-all
        continue-on-error: true

      - name: Run S3 Pytest Integration Tests  
        working-directory: backend/ng
        run: |
          echo "Running S3 pytest integration tests..."
          make test-s3-pytest
        env:
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || 'ctf-ng-test-bucket' }}
          AWS_S3_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Test Summary
        run: |
          echo "S3 integration tests completed."
          echo "Note: Some tests may fail if AWS credentials are not configured."
          echo "This is expected in forks and external PRs for security reasons."