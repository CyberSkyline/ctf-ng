<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="text/javascript">
    window.init = {
      csrfToken: '{{ Session.nonce }}',
      userId: '{{ user_id }}' || null,
      impersonated: {{ (session.impersonated or false) | tojson }},
      error: {{ (error or none) | tojson }}
    };
  </script>
  <script type="module" crossorigin src="{{ static_build_path }}/index.js"></script>
  <link rel="stylesheet" crossorigin href="{{ static_build_path }}/style.css">
</head>

<body>
  <div id="root"></div>
</body>

</html>
