services:
  ctfd:
    build:
      context: ./
      dockerfile: ./dockerfiles/ctfd.Dockerfile
    container_name: ng-ctfd
    user: root
    restart: always
    ports:
      - "8000:8000"
      - "4000:4000"
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      - WORKER_CLASS=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      - THREADS=100   
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - ./backend/ng:/opt/CTFd/CTFd/plugins/ng/:ro
      - /var/lib/certs/ssl/:/var/lib/certs/ssl/
    depends_on:
      - db
      - cache
      - vite
      - nginx
    networks:
      default:
      internal:
    tty: true
    entrypoint : /bin/bash
    # command : -c "exec bash"                                                    
    command : -c "/usr/bin/supervisord -c /etc/supervisor/supervisord.conf && supervisorctl tail -f ctfd"

  nginx:
    image: nginx:1.28
    container_name: ng-nginx
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/vite-build:ro
    ports:
      - 80:80
      - 5173:5173

  db:
    image: mariadb:10.11
    container_name: ng-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
        default:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:7-alpine
    container_name: ng-redis
    restart: always
    volumes:
      - .data/redis:/data
    networks:
      internal:
      default:
    ports:
      - "6379:6379"

  vite:
    build:
      context: ./
      dockerfile: ./dockerfiles/vite.Dockerfile
    container_name: ng-vite
    restart: always
    tty: true
    volumes:
      - ./frontend:/app/frontend
      - ./node_modules:/app/node_modules

  minio:
    image: quay.io/minio/minio:latest
    container_name: ng-minio
    restart: always
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
    default:
    internal:
      internal: true
