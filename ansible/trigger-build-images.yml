- name: Trigger image build and push
  hosts: manager

  # github_token: github PAT in semaphore variable group

  tasks:
    - name: Dispatch build-and-push-images workflow
      ansible.builtin.uri:
        url: "https://api.github.com/repos/CyberSkyline/ctf-ng/actions/workflows/build-and-push-images.yml/dispatches"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          ref: "{{ ctfd_environment }}"
          inputs:
            ref: "{{ ctfd_environment }}"
        status_code: 204
      no_log: true
