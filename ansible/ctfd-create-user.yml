- name: Create CTFd user
  hosts: manager
  # Semaphore survey variables:
  #   ctfd_user_email    - email for the new user                (String, required)
  #   ctfd_user_password - password for the new user             (Secret, required)
  #   ctfd_user_admin    - grant admin role                       (Boolean(enum), optional)
  #   ctfd_user_name     - display name                           (String, optional)
  tasks:
    - name: Run create_user.sh
      ansible.builtin.command:
        cmd: >-
          ./.bin/create_user.sh --yes
          {{ '--admin' if ctfd_user_admin | default(false) | bool else '' }}
          --name {{ ctfd_user_name | default('new user') | quote }}
          {{ ctfd_user_email }}
        chdir: "{{ ctfd_repo_path }}"
        stdin: "{{ ctfd_user_password }}"
      no_log: true
