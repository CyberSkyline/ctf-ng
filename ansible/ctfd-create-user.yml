- name: Create CTFd user

  # Survey vars: ctfd_user_email (String), ctfd_user_password (Secret),
  # ctfd_user_name (String, optional), ctfd_user_admin (Boolean, optional)

  hosts: manager
  tasks:
    - ansible.builtin.include_tasks: tasks/find-ctfd-container.yml

    - name: Run create_user.py in {{ ctfd_container }}
      ansible.builtin.shell: |
        docker exec -i -e SCRIPT=true -e PYTHONPATH=/opt/CTFd/ {{ ctfd_container | quote }} /bin/bash -c '
          if [ -f /opt/CTFd/conf/ctfd/init_secrets.py ]; then
            eval "$(python3 /opt/CTFd/conf/ctfd/init_secrets.py)"
          fi
          exec python3 -c "import json, runpy, sys; sys.argv = sys.argv[1:] + json.load(sys.stdin); runpy.run_path(sys.argv[0], run_name=__name__)" \
            /opt/CTFd/CTFd/plugins/ng/scripts/create_user.py'
      args:
        stdin: >-
          {{ ([ctfd_user_email, ctfd_user_password, '--name', ctfd_user_name | default('new user', true)]
              + (['--admin'] if ctfd_user_admin | default(false) | bool else [])) | to_json }}
      delegate_to: "{{ ctfd_node_host }}"
      register: create_user_result
      failed_when: false
      no_log: true

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ create_user_result.stdout_lines | reject('search', 'Loaded module, <module') | list
          + (create_user_result.stderr_lines if create_user_result.rc != 0 else []) }}"

    - name: Fail if the script reported an error
      ansible.builtin.fail:
        msg: "{{ 'User already exists' if 'Skipped' in create_user_result.stdout else 'Script failed, see the output above' }}"
      when: create_user_result.rc != 0 or 'Skipped' in create_user_result.stdout
