- name: Clean up event containers

  # Survey vars: ctfd_event_id (String) or ctfd_event_name (String),
  # ctfd_cleanup_stop (Boolean, optional), ctfd_cleanup_prune (Boolean, optional),
  # ctfd_cleanup_allow_active (Boolean, optional)
  # Leave stop and prune unset to just list the event's containers

  hosts: manager
  tasks:
    - ansible.builtin.include_tasks: tasks/find-ctfd-container.yml

    - name: Run event_cleanup.py in {{ ctfd_container }}
      ansible.builtin.shell: |
        docker exec -i -e SCRIPT=true -e PYTHONPATH=/opt/CTFd/ {{ ctfd_container | quote }} /bin/bash -c '
          if [ -f /opt/CTFd/conf/ctfd/init_secrets.py ]; then
            eval "$(python3 /opt/CTFd/conf/ctfd/init_secrets.py)"
          fi
          exec python3 -c "import json, runpy, sys; sys.argv = sys.argv[1:] + json.load(sys.stdin); runpy.run_path(sys.argv[0], run_name=__name__)" \
            /opt/CTFd/CTFd/plugins/ng/scripts/event_cleanup.py'
      args:
        stdin: >-
          {{ ((['--event-id', ctfd_event_id | string] if ctfd_event_id | default('', true) else [])
              + (['--name', ctfd_event_name] if ctfd_event_name | default('', true) else [])
              + (['--stop'] if ctfd_cleanup_stop | default(false) | bool else [])
              + (['--prune'] if ctfd_cleanup_prune | default(false) | bool else [])
              + (['--allow-active'] if ctfd_cleanup_allow_active | default(false) | bool else [])) | to_json }}
      delegate_to: "{{ ctfd_node_host }}"
      register: cleanup_result
      failed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ cleanup_result.stdout_lines + (cleanup_result.stderr_lines if cleanup_result.rc != 0 else []) }}"

    - name: Fail if the script reported an error
      ansible.builtin.fail:
        msg: Script failed, see the output above
      when: cleanup_result.rc != 0
