- name: Clean up event containers
  hosts: manager
  # Semaphore survey variables:
  # Leave stop and prune unset to just list the event's containers
  #   ctfd_event_id             - ID of the event                                  (String, required if no name)
  #   ctfd_event_name           - name of the event                                (String, required if no ID)
  #   ctfd_cleanup_stop         - stop the containers                              (Boolean(enum), optional)
  #   ctfd_cleanup_prune        - remove containers, networks and DB rows          (Boolean(enum), optional)
  #   ctfd_cleanup_allow_active - allow stop/prune before the event ends           (Boolean(enum), optional)
  tasks:
    - name: Run event_cleanup.sh
      ansible.builtin.command:
        argv: >-
          {{
            ['./.bin/event_cleanup.sh']
            + (['--event-id', ctfd_event_id | string] if ctfd_event_id | default('', true) else [])
            + (['--name', ctfd_event_name] if ctfd_event_name | default('', true) else [])
            + (['--stop'] if ctfd_cleanup_stop | default(false) | bool else [])
            + (['--prune'] if ctfd_cleanup_prune | default(false) | bool else [])
            + (['--allow-active'] if ctfd_cleanup_allow_active | default(false) | bool else [])
          }}
        chdir: "{{ ctfd_repo_path }}"
      register: cleanup

    # Command output is only shown on failure, so print it here as well
    - name: Show output
      ansible.builtin.debug:
        var: cleanup.stdout_lines
