- name: Set CTFd user password
  hosts: all
  # Semaphore survey variables:
  #   ctfd_user_email    - user whose password to change   (String, required)
  #   ctfd_user_password - new password                     (Secret, required)
  tasks:
    - name: Run update_user_password.sh
      ansible.builtin.command:
        cmd: ./.bin/update_user_password.sh --yes {{ ctfd_user_email }}
        chdir: "{{ ctfd_repo_path }}"
        stdin: "{{ ctfd_user_password }}"
      no_log: true
