- name: Set CTFd user password

  # Survey vars: ctfd_user_email (String), ctfd_user_password (Secret)

  hosts: manager
  tasks:
    - ansible.builtin.include_tasks: tasks/find-ctfd-container.yml

    - name: Run update_user_password.py in {{ ctfd_container }}
      ansible.builtin.shell: |
        docker exec -i -e SCRIPT=true -e PYTHONPATH=/opt/CTFd/ {{ ctfd_container | quote }} /bin/bash -c '
          if [ -f /opt/CTFd/conf/ctfd/init_secrets.py ]; then
            eval "$(python3 /opt/CTFd/conf/ctfd/init_secrets.py)"
          fi
          exec python3 -c "import json, runpy, sys; sys.argv = sys.argv[1:] + json.load(sys.stdin); runpy.run_path(sys.argv[0], run_name=__name__)" \
            /opt/CTFd/CTFd/plugins/ng/scripts/update_user_password.py'
      args:
        stdin: "{{ [ctfd_user_email, ctfd_user_password] | to_json }}"
      delegate_to: "{{ ctfd_node_host }}"
      register: set_password_result
      failed_when: false
      no_log: true

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ set_password_result.stdout_lines + set_password_result.stderr_lines }}"

    - name: Fail if the script reported an error
      ansible.builtin.fail:
        msg: See the output above.
      when: set_password_result.rc != 0
