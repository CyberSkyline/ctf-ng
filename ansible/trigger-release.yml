- name: Trigger release
  hosts: manager

  # github_token attached to task template in Semaphore
  # ctfd_environment comes from inventory to allow the same playbook to be used for staging and prod

  tasks:
    - name: Dispatch release workflow
      ansible.builtin.uri:
        url: "https://api.github.com/repos/CyberSkyline/ctf-ng/actions/workflows/release.yml/dispatches"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          ref: "{{ ctfd_environment }}"
          inputs:
            ref: "{{ ctfd_environment }}"
        status_code: 204
      no_log: true
