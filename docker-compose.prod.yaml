version: '3.8'

services:
  ctfd:
    image: ctfd-ng:latest
    build:
      context: ./
      dockerfile: ./dockerfiles/ctfd.Dockerfile
    user: root
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    ports:
      - mode: host
        target: 8000
        published: 8000
      - mode: host
        target: 4000
        published: 4000
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - WORKER_CLASS=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      - THREADS=100
    volumes:
      - type: bind
        source: ./.data/CTFd/logs
        target: /var/log/CTFd
      - type: bind
        source: ./.data/CTFd/uploads
        target: /var/uploads
      - type: bind
        source: ./backend/ng
        target: /opt/CTFd/CTFd/plugins/ng/
        read_only: true
      - type: bind
        source: /var/lib/certs/ssl/
        target: /var/lib/certs/ssl/
    networks:
      - ctf-network
      - ctf-internal
    tty: true
    entrypoint: /bin/bash
    command: -c "/usr/bin/supervisord -c /etc/supervisor/supervisord.conf && supervisorctl tail -f ctfd"

  nginx:
    image: nginx:1.28
    deploy:
      replicas: 2
      restart_policy:
        condition: any
    volumes:
      - type: bind
        source: ./conf/nginx/http.prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./sslpublickey.pem
        target: /certificates/sslpublickey.pem
        read_only: true
      - type: bind
        source: ./privatesslkey.pem
        target: /certificates/privatesslkey.pem
        read_only: true
      - type: bind
        source: ./frontend/dist
        target: /var/www/vite-build
        read_only: true
    ports:
      - mode: host
        target: 80
        published: 80
      - mode: host
        target: 443
        published: 443
    networks:
      - ctf-network

  db:
    image: mariadb:10.11
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - type: bind
        source: ./.data/mysql
        target: /var/lib/mysql
    networks:
      - ctf-network
      - ctf-internal
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    volumes:
      - type: bind
        source: ./.data/redis
        target: /data
    networks:
      - ctf-network
      - ctf-internal

  vite:
    image: vite-ng:latest
    build:
      context: ./
      dockerfile: ./dockerfiles/vite.Dockerfile
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    tty: true
    ports:
      - mode: host
        target: 5173
        published: 5173
    volumes:
      - type: bind
        source: ./frontend
        target: /app/frontend
      - type: bind
        source: ./node_modules
        target: /app/node_modules
    networks:
      - ctf-network

networks:
  ctf-network:
    driver: overlay
  ctf-internal:
    driver: overlay
    internal: true