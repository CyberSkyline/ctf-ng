version: '3.8'

services:
  ctfd:
    hostname: 'ctfng_app-{{.Task.Slot}}'
    image: ctfd-ng:latest
    build:
      context: ./
      dockerfile: ./dockerfiles/ctfd.Dockerfile
    user: root
    deploy:
      replicas: 5
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - WORKER_CLASS=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      - THREADS=100
    volumes:
      - type: bind
        source: ./.data/CTFd/logs
        target: /var/log/CTFd
      - type: bind
        source: ./.data/CTFd/uploads
        target: /var/uploads
      - type: bind
        source: ./backend/ng
        target: /opt/CTFd/CTFd/plugins/ng/
        read_only: true
      - type: bind
        source: /var/lib/certs/ssl/
        target: /var/lib/certs/ssl/
    networks:
      ctf-network:
        aliases:
          - 'ctfng_app-{{.Task.Slot}}'
      ctf-internal:
        aliases:
          - 'ctfng_app-{{.Task.Slot}}'
    tty: true
    entrypoint: /bin/bash
    command: -c "/usr/bin/supervisord -c /etc/supervisor/supervisord.conf && supervisorctl tail -f ctfd"

  nginx:
    image: nginx:1.29.3
    deploy:
      replicas: 2
      restart_policy:
        condition: any
    volumes:
      - type: bind
        source: ./conf/nginx/http.prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./conf/nginx/self.pem
        target: /etc/nginx/self.pem
        read_only: true
      - type: bind
        source: ./sslpublickey.pem
        target: /certificates/sslpublickey.pem
        read_only: true
      - type: bind
        source: ./privatesslkey.pem
        target: /certificates/privatesslkey.pem
        read_only: true
      - type: bind
        source: ./frontend/dist
        target: /var/www/vite-build
        read_only: true
      - type: bind
        source: /mnt/prescup-web
        target: /usr/share/nginx/html
        read_only: true
    ports:
      - mode: host
        target: 80
        published: 80
      - mode: host
        target: 443
        published: 443
    networks:
      - ctf-network

  cache:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    volumes:
      - type: bind
        source: ./.data/redis
        target: /data
    networks:
      - ctf-network
      - ctf-internal

networks:
  ctf-network:
    driver: overlay
  ctf-internal:
    driver: overlay
    internal: true
