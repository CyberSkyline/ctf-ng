version: '3.8'

services:
  ctfd:
    hostname: 'ctfng_app-{{.Task.Slot}}'
    image: ctfd-ng:latest
    build:
      context: ./
      dockerfile: ./dockerfiles/ctfd.Dockerfile
    user: root
    deploy:
      replicas: 5
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - FLASK_ENV=production
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_SECRET_NAME=${CTFD_SECRET_NAME:-ctf-ng/production}
      - WORKER_CLASS=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      - THREADS=100
      - WORKERS=${WORKERS:-1}
      - ACCESS_LOG=-
      - ERROR_LOG=-
    volumes:
      - type: bind
        source: ./.data/CTFd/logs
        target: /var/log/CTFd
      - type: bind
        source: ./.data/CTFd/uploads
        target: /var/uploads
      - type: bind
        source: ./backend/ng
        target: /opt/CTFd/CTFd/plugins/ng/
        read_only: true
      - type: bind
        source: ./.env.prod
        target: /opt/CTFd/.env.prod
        read_only: true
      - type: bind
        source: /var/lib/certs/ssl/
        target: /var/lib/certs/ssl/
    networks:
      ctf-network:
        aliases:
          - 'ctfng_app-{{.Task.Slot}}'
      ctf-internal:
        aliases:
          - 'ctfng_app-{{.Task.Slot}}'
    tty: true
    entrypoint: /bin/bash
    command: -c "cd /opt/CTFd && /opt/CTFd/conf/ctfd/run_production.sh"

  nginx:
    image: nginx:1.29.3
    deploy:
      replicas: 2
      restart_policy:
        condition: any
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_SECRET_NAME=${NGINX_SECRET_NAME:-ctf-ng/nginx-ssl}
      - SSL_DIR=/etc/nginx/ssl
    volumes:
      - type: bind
        source: ./conf/nginx/http.prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./conf/nginx
        target: /opt/nginx/conf
        read_only: true
      - type: tmpfs
        target: /etc/nginx/ssl
        tmpfs:
          size: 104857600
      - type: bind
        source: ./frontend/dist
        target: /var/www/vite-build
        read_only: true
      - type: bind
        source: /mnt/prescup-web
        target: /usr/share/nginx/html
        read_only: true
    ports:
      - mode: host
        target: 80
        published: 80
      - mode: host
        target: 443
        published: 443
    networks:
      - ctf-network
    entrypoint: /bin/bash
    command: -c "apt-get update -qq && apt-get install -y -qq awscli && /opt/nginx/conf/init_ssl.sh && nginx -g 'daemon off;'"

  cache:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    volumes:
      - type: bind
        source: ./.data/redis
        target: /data
    networks:
      - ctf-network
      - ctf-internal

  grafana:
    image: grafana/grafana:12.3.1
    deploy:
      replicas: 1
      placement:
        # pin grafana to the manager node to ensure it always works from the same .data
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    user: "0"
    volumes:
      - type: bind
        source: ./.data/grafana
        target: /var/lib/grafana
      - type: bind
        source: ./conf/grafana
        target: /etc/grafana
        read_only: true
    env_file: ./conf/grafana/.env
    networks:
      - ctf-network
      - ctf-internal

networks:
  ctf-network:
    driver: overlay
  ctf-internal:
    driver: overlay
    internal: true
